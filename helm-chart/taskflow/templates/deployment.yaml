apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "taskflow.fullname" . }}
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ include "taskflow.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "taskflow.name" . }}

    spec:
      containers:
      - name: taskflow-app

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: 5000

        livenessProbe:
          httpGet:
            path: {{ .Values.health.path }}
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: {{ .Values.health.path }}
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5

        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}

          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}

