apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskflow-app
  namespace: taskflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskflow-app

  template:
    metadata:
      labels:
        app: taskflow-app

    spec:
      containers:
      - name: taskflow-app
        image: docker-taskflow-app:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"
