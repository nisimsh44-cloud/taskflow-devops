apiVersion: apps/v1
kind: Deployment

metadata:
  name: taskflow-app
  namespace: taskflow

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: taskflow-app

  template:
    metadata:
      labels:
        app: taskflow-app

    spec:
      containers:
      - name: taskflow-app
        image: nisimsharabi/taskflow-app:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"
