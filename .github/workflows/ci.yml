name: TaskFlow CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t taskflow-app -f docker/Dockerfile .

      - name: Run container
        run: docker run -d -p 5000:5000 --name taskflow-test taskflow-app

      - name: Check container logs
        if: always()
        run: docker logs taskflow-test

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:5000/health

      - name: Stop container
        if: always()
        run: docker stop taskflow-test
